name: Component Detection

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

permissions:
  contents: write
  id-token: write

jobs:
  dependency-submission:
    strategy:
      fail-fast: false
    runs-on: 'ubuntu-latest'
    name: Component Detection
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        
      - name: Restore .NET dependencies via nuget
        run: dotnet restore

      - name: Component Detection Snapshot Dependency Submission
        uses: advanced-security/component-detection-dependency-submission-action@v0.1.0
